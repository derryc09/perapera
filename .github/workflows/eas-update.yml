name: EAS Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eas-update-production
  cancel-in-progress: true

jobs:
  update:
    name: Publish production update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN repository secret."
            echo "Create one at https://expo.dev/settings/access-tokens"
            echo "Then add it at https://github.com/derryc09/perapera/settings/secrets/actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: eas update --channel production --platform ios --message "$UPDATE_MESSAGE" --non-interactive
